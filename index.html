<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDoc, onSnapshot, serverTimestamp, deleteField } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  // Reemplaza con tu configuración real de Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyBYJhuTOXp0NlFdzkuIUixlN3xi-_8HAgI",
    authDomain: "mantencion-5d40b.firebaseapp.com",
    projectId: "mantencion-5d40b",
    storageBucket: "mantencion-5d40b.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcdef..."
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  
  const $ = id => document.getElementById(id);
  
  let currentUser = null;
  let userRole = "solicitante"; // Por defecto
  let calendar = null;
  let unsubscribeEvents = null;
  let currentEventData = null; // Para guardar datos del evento al editar

  // ==========================================
  // AUTENTICACIÓN Y ROLES
  // ==========================================
  
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      $('currentUserEmail').textContent = user.email;
      
      // Obtener el rol del usuario desde Firestore (usando el UID)
      try {
        const userDoc = await getDoc(doc(db, "usuarios", user.uid));
        if (userDoc.exists() && userDoc.data().rol) {
          userRole = userDoc.data().rol;
        } else {
          userRole = "solicitante";
        }
      } catch (error) {
        console.error("Error obteniendo rol, asignando solicitante.", error);
        userRole = "solicitante";
      }

      $('currentUserRole').textContent = userRole.toUpperCase();
      $('permissionRoleLabel').textContent = userRole.toUpperCase();
      $('loginScreen').classList.add('hidden');
      
      inicializarCalendario();
      cargarEventos();
    } else {
      currentUser = null;
      userRole = "solicitante";
      $('loginScreen').classList.remove('hidden');
      if (unsubscribeEvents) unsubscribeEvents();
    }
  });

  $('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = $('loginEmail').value;
    const password = $('loginPassword').value;
    $('loginError').classList.add('hidden');
    
    signInWithEmailAndPassword(auth, email, password)
      .catch((error) => {
        $('loginError').textContent = "Credenciales inválidas o error de red.";
        $('loginError').classList.remove('hidden');
      });
  });

  $('btnLogout').addEventListener('click', () => signOut(auth));

  // ==========================================
  // CALENDARIO Y EVENTOS
  // ==========================================
  
  function inicializarCalendario() {
    const calendarEl = $('calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: window.innerWidth < 640 ? 'listWeek' : 'dayGridMonth',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek,listWeek'
      },
      locale: 'es',
      buttonText: { today: 'Hoy', month: 'Mes', week: 'Semana', list: 'Lista' },
      eventClick: (info) => abrirModal(info.event),
      height: 'auto'
    });
    calendar.render();
  }

  function cargarEventos() {
    unsubscribeEvents = onSnapshot(collection(db, "requerimientos"), (snapshot) => {
      let total = 0, pendientes = 0, finalizados = 0;
      calendar.removeAllEvents();
      
      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        total++;
        if (data.finalizado) finalizados++; else pendientes++;
        
        calendar.addEvent({
          id: docSnap.id,
          title: data.title,
          start: data.start,
          end: data.end,
          backgroundColor: data.finalizado ? '#10b981' : '#f59e0b', // Verde si terminó, naranja si pendiente
          borderColor: data.finalizado ? '#059669' : '#d97706',
          extendedProps: { ...data }
        });
      });
      
      $('totalCount').textContent = total;
      $('pendingCount').textContent = pendientes;
      $('doneCount').textContent = finalizados;
    }, (error) => {
      console.error("Error cargando eventos:", error);
    });
  }

  // ==========================================
  // LÓGICA DEL MODAL Y FORMULARIO
  // ==========================================
  
  $('btnNuevo').addEventListener('click', () => abrirModal(null));
  $('btnClose').addEventListener('click', cerrarModal);
  $('btnCancel').addEventListener('click', cerrarModal);
  
  // Mostrar/Ocultar input de duración personalizada
  $('durationInput').addEventListener('change', (e) => {
    if (e.target.value === 'custom') {
      $('customDurationWrap').classList.remove('hidden');
      $('customDurationInput').required = true;
    } else {
      $('customDurationWrap').classList.add('hidden');
      $('customDurationInput').required = false;
    }
  });

  function abrirModal(eventoFullCalendar) {
    $('formReq').reset();
    $('loginError').classList.add('hidden');
    $('customDurationWrap').classList.add('hidden');
    $('customDurationInput').required = false;
    
    const esAdminOMante = (userRole === 'admin' || userRole === 'mantenimiento');

    if (eventoFullCalendar) {
      // MODO EDICIÓN
      $('modalTitle').textContent = "Editar requerimiento";
      const props = eventoFullCalendar.extendedProps;
      currentEventData = props; // Guardar estado previo
      
      $('eventId').value = eventoFullCalendar.id;
      $('titleInput').value = props.title;
      $('dateInput').value = props.start.substring(0, 10);
      $('timeInput').value = props.start.substring(11, 16);
      $('statusInput').value = props.finalizado ? "true" : "false";
      
      // Asignar duración
      const dOptions = Array.from($('durationInput').options).map(o => o.value);
      if (dOptions.includes(props.durationMin.toString())) {
        $('durationInput').value = props.durationMin.toString();
      } else {
        $('durationInput').value = 'custom';
        $('customDurationWrap').classList.remove('hidden');
        $('customDurationInput').value = props.durationMin;
        $('customDurationInput').required = true;
      }

      // Restricciones visuales de rol para edición
      if (esAdminOMante) {
        $('btnDelete').classList.remove('hidden');
        $('statusInput').disabled = false;
        $('statusPermissionHint').classList.add('hidden');
      } else {
        $('btnDelete').classList.add('hidden');
        $('statusInput').disabled = true; // Bloquea cambiar a finalizado
        $('statusPermissionHint').classList.remove('hidden');
      }

    } else {
      // MODO NUEVO REQUERIMIENTO
      $('modalTitle').textContent = "Nuevo requerimiento";
      $('eventId').value = "";
      currentEventData = null;
      
      // Valores por defecto
      const hoy = new Date();
      $('dateInput').value = hoy.toISOString().substring(0, 10);
      $('timeInput').value = "08:00";
      $('statusInput').value = "false";
      
      $('btnDelete').classList.add('hidden');
      
      if (!esAdminOMante) {
        $('statusInput').disabled = true;
        $('statusPermissionHint').classList.remove('hidden');
      } else {
        $('statusInput').disabled = false;
        $('statusPermissionHint').classList.add('hidden');
      }
    }
    
    $('modal').classList.remove('hidden');
  }

  function cerrarModal() {
    $('modal').classList.add('hidden');
  }

  // ==========================================
  // GUARDAR EN FIRESTORE (RESPETANDO REGLAS)
  // ==========================================
  
  $('formReq').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const id = $('eventId').value;
    const titleVal = $('titleInput').value.trim();
    const dateVal = $('dateInput').value;
    const timeVal = $('timeInput').value;
    const statusVal = $('statusInput').value === "true";
    
    let durationVal = parseInt($('durationInput').value);
    if ($('durationInput').value === 'custom') {
      durationVal = parseInt($('customDurationInput').value);
    }
    
    // Calcular fecha final sumando los minutos a la fecha de inicio
    const startIso = `${dateVal}T${timeVal}:00`;
    const startDateObj = new Date(startIso);
    startDateObj.setMinutes(startDateObj.getMinutes() + durationVal);
    
    // Ajustar formato a ISO sin la 'Z' para FullCalendar
    const pad = n => n.toString().padStart(2, '0');
    const endIso = `${startDateObj.getFullYear()}-${pad(startDateObj.getMonth()+1)}-${pad(startDateObj.getDate())}T${pad(startDateObj.getHours())}:${pad(startDateObj.getMinutes())}:00`;

    const esAdminOMante = (userRole === 'admin' || userRole === 'mantenimiento');

    try {
      if (!id) {
        // CREAR NUEVO
        await addDoc(collection(db, "requerimientos"), {
          title: titleVal,
          start: startIso,
          end: endIso,
          durationMin: durationVal,
          finalizado: false, // La regla impide crear finalizados
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
          createdBy: currentUser.uid,
          createdByEmail: currentUser.email
        });
      } else {
        // ACTUALIZAR EXISTENTE
        if (esAdminOMante) {
          // Payload para Admin / Mantenimiento
          let payload = {
            title: titleVal,
            start: startIso,
            end: endIso,
            durationMin: durationVal,
            updatedAt: serverTimestamp(),
            updatedBy: currentUser.uid,
            finalizado: statusVal
          };
          
          // Lógica de finalización exigida por las reglas
          const estabaFinalizado = currentEventData ? currentEventData.finalizado : false;
          
          if (statusVal && !estabaFinalizado) {
            payload.finalizadoBy = currentUser.uid;
            payload.finalizadoByEmail = currentUser.email;
            payload.finalizadoAt = serverTimestamp();
          } else if (!statusVal) {
            // Si lo devuelven a pendiente, borrar rastro del finalizador falso
            payload.finalizadoBy = deleteField();
            payload.finalizadoByEmail = deleteField();
            payload.finalizadoAt = deleteField();
          }
          
          await updateDoc(doc(db, "requerimientos", id), payload);

        } else {
          // Payload para Solicitantes (No se envía la llave 'finalizado' para cumplir el diff affectedKeys)
          await updateDoc(doc(db, "requerimientos", id), {
            title: titleVal,
            start: startIso,
            end: endIso,
            durationMin: durationVal,
            updatedAt: serverTimestamp(),
            updatedBy: currentUser.uid
          });
        }
      }
      cerrarModal();
    } catch (error) {
      console.error("Error guardando el documento:", error);
      alert("No tienes permisos para realizar esta acción o ocurrió un error.");
    }
  });

  // ==========================================
  // ELIMINAR REQUERIMIENTO
  // ==========================================
  
  $('btnDelete').addEventListener('click', async () => {
    const id = $('eventId').value;
    if (!id) return;
    
    if (confirm("¿Estás seguro de que deseas eliminar este requerimiento? Esta acción no se puede deshacer.")) {
      try {
        await deleteDoc(doc(db, "requerimientos", id));
        cerrarModal();
      } catch (error) {
        console.error("Error eliminando:", error);
        alert("No tienes permisos para eliminar este requerimiento.");
      }
    }
  });

</script>
