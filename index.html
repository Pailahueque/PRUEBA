<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Mantenimiento</title>
    
    <!-- Librería FullCalendar -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    
    <style>
        body { margin: 40px 10px; font-family: 'Segoe UI', sans-serif; background: #f4f7f6; }
        #calendar-container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .fc-event { cursor: pointer; background-color: #e67e22 !important; border: none !important; }
    </style>
</head>
<body>

    <h1 style="text-align: center; color: #2c3e50;">Requerimientos de Mantenimiento</h1>
    
    <div id="calendar-container">
        <div id='calendar'></div>
    </div>

    <!-- Script como módulo para usar Firebase -->
    <script type="module">
        // 1. Importaciones usando enlaces directos para HTML/GitHub Pages
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-analytics.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 2. Tu configuración exacta de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBYJhuTOXp0NlFdzkuIUixlN3xi-_8HAgI",
            authDomain: "mantencion-5d40b.firebaseapp.com",
            projectId: "mantencion-5d40b",
            storageBucket: "mantencion-5d40b.firebasestorage.app",
            messagingSenderId: "501022345786",
            appId: "1:501022345786:web:07d101f80a9d6700e50303",
            measurementId: "G-V8SBH644R6"
        };

        // 3. Inicializar Firebase, Analytics y la Base de Datos (Firestore)
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        const eventosCollection = collection(db, "requerimientos");

        // 4. Lógica del Calendario
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'es',
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
                editable: true,
                selectable: true,

                // LEER EVENTOS DE TU BASE DE DATOS
                events: async function(info, successCallback, failureCallback) {
                    try {
                        const querySnapshot = await getDocs(eventosCollection);
                        const eventos = [];
                        querySnapshot.forEach((doc) => {
                            eventos.push({
                                id: doc.id,
                                title: doc.data().title,
                                start: doc.data().start,
                                end: doc.data().end
                            });
                        });
                        successCallback(eventos);
                    } catch (error) {
                        console.error("Error al cargar eventos:", error);
                        failureCallback(error);
                    }
                },

                // GUARDAR UN NUEVO EVENTO
                select: async function(info) {
                    var title = prompt('Ingrese el requerimiento (Ej: Revisión de compresor):');
                    if (title) {
                        try {
                            await addDoc(eventosCollection, {
                                title: title,
                                start: info.startStr,
                                end: info.endStr
                            });
                            calendar.refetchEvents(); 
                        } catch (error) {
                            console.error("Error al guardar:", error);
                            alert("Hubo un error al guardar. Revisa la consola o las reglas de Firebase.");
                        }
                    }
                    calendar.unselect();
                },

                // ELIMINAR UN EVENTO
                eventClick: async function(info) {
                    if (confirm("¿Desea eliminar el requerimiento: '" + info.event.title + "'?")) {
                        try {
                            await deleteDoc(doc(db, "requerimientos", info.event.id));
                            info.event.remove();
                        } catch (error) {
                            console.error("Error al eliminar:", error);
                        }
                    }
                }
            });
            calendar.render();
        });
    </script>
</body>
</html>
